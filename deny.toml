# cargo-deny config. Goal: keep the project MIT-licensable by rejecting any
# copyleft (GPL, LGPL, AGPL, MPL) dep that sneaks into the graph. Anything not
# in `allow` is rejected by default — add permissive SPDX IDs here as needed.

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # Cargo.toml [patch.crates-io] override; remove once displaydoc 0.2.6 is on crates.io
  "https://github.com/yaahc/displaydoc",
]
